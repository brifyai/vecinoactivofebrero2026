[supervisord]
nodaemon=true
user=root

[program:backend]
command=/bin/sh /app/start-backend.sh
directory=/app/server
autostart=true
autorestart=true
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
environment=REACT_APP_SUPABASE_URL="%(ENV_REACT_APP_SUPABASE_URL)s",REACT_APP_SUPABASE_ANON_KEY="%(ENV_REACT_APP_SUPABASE_ANON_KEY)s",REACT_APP_GEMINI_API_KEY="%(ENV_REACT_APP_GEMINI_API_KEY)s",PORT="%(ENV_PORT)s",CORS_ORIGIN="%(ENV_CORS_ORIGIN)s"

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
