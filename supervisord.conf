[supervisord]
nodaemon=true
user=root

[program:backend]
command=/bin/sh -c 'export SUPABASE_URL="$REACT_APP_SUPABASE_URL" && export SUPABASE_SERVICE_ROLE_KEY="$REACT_APP_SUPABASE_ANON_KEY" && export JWT_SECRET="${JWT_SECRET:-default-secret-key}" && export PORT="${PORT:-3008}" && export CORS_ORIGIN="${CORS_ORIGIN:-*}" && node /app/server/dist/index.js'
directory=/app/server
autostart=true
autorestart=true
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
