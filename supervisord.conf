[supervisord]
nodaemon=true
user=root

[program:backend]
command=node /app/server/dist/index.js
directory=/app/server
autostart=true
autorestart=true
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
environment=NODE_ENV=production,SUPABASE_URL="%(ENV_SUPABASE_URL)s",SUPABASE_SERVICE_ROLE_KEY="%(ENV_SUPABASE_SERVICE_ROLE_KEY)s",JWT_SECRET="%(ENV_JWT_SECRET)s",PORT="%(ENV_PORT)s",CORS_ORIGIN="%(ENV_CORS_ORIGIN)s"

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
