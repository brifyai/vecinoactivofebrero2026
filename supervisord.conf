[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=debug

[program:backend]
command=node /app/server/dist/index.js
directory=/app/server
autostart=true
autorestart=true
startsecs=3
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
environment=NODE_ENV="production",PORT="3008"

[program:nginx]
command=nginx -g 'daemon off; error_log /var/log/nginx/error.log debug;'
autostart=true
autorestart=true
startsecs=2
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[eventlistener:processes]
command=/bin/bash -c "printf 'READY\n' && while read line; do kill -SIGQUIT $PPID; done < /dev/stdin"
events=PROCESS_STATE_FATAL
REPLACE

