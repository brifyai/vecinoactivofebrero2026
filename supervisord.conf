[supervisord]
nodaemon=true
user=root

[program:backend]
command=/bin/sh -c 'export SUPABASE_URL="%(ENV_REACT_APP_SUPABASE_URL)s" && export SUPABASE_SERVICE_ROLE_KEY="% (ENV_REACT_APP_SUPABASE_ANON_KEY)s" && export JWT_SECRET="%(ENV_REACT_APP_SUPABASE_ANON_KEY)s" && export PORT="%(ENV_PORT)s" && export CORS_ORIGIN="%(ENV_CORS_ORIGIN)s" && node /app/server/dist/index.js'
directory=/app/server
autostart=true
autorestart=true
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
