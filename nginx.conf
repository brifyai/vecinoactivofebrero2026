upstream backend {
    server backend:3008;
    keepalive 32;
}

# ============================================
# RATE LIMITING - Debe estar en contexto http
# ============================================

# Zone para rate limiting de autenticación
# 10m = 10 megabytes de memoria para almacenar estados (~80,000 IPs)
# rate=5r/m = 5 requests por minuto por IP
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# ============================================
# CONFIGURACIÓN DE DOMINIOS
# ============================================
# REEMPLAZAR con tu dominio real:
# server_name vecinoactivo.cl www.vecinoactivo.cl;
#
# Para múltiples dominios:
# server_name vecinoactivo.cl www.vecinoactivo.cl app.vecinoactivo.cl;

# HTTP - Redirect to HTTPS
server {
    listen 80;
    # REEMPLAZAR: server_name _; por tu dominio real
    # Ejemplo: server_name vecinoactivo.cl www.vecinoactivo.cl;
    server_name _;

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    # REEMPLAZAR: server_name _; por tu dominio real
    # Ejemplo: server_name vecinoactivo.cl www.vecinoactivo.cl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # SSL CERTIFICATES - Let's Encrypt
    # ============================================
    # Certificados reales de Let's Encrypt (producción)
    ssl_certificate /etc/letsencrypt/live/vecinoactivo.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vecinoactivo.cl/privkey.pem;

    # Si usas certificado wildcard:
    # ssl_certificate /etc/letsencrypt/live/vecinoactivo.cl-0001/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vecinoactivo.cl-0001/privkey.pem;

    # NOTA: Para desarrollo local, usar certificados autofirmados:
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling (mejora rendimiento SSL)
    # Descomentar cuando uses certificados reales:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/vecinoactivo.cl/chain.pem;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    # ============================================
    # SECURITY HEADERS - Configuración para SPA React/Vite
    # ============================================
    # NOTA: Estos headers son seguros para aplicaciones React/Vite
    # y no interfieren con el funcionamiento de la SPA

    # 1. Strict-Transport-Security (HSTS)
    # Fuerza conexiones HTTPS por 1 año, incluye subdominios
    # PRECAUCIÓN: Una vez habilitado, el dominio solo funcionará con HTTPS
    # Descomentar SOLO cuando estés seguro de que HTTPS funciona correctamente
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 2. Content-Security-Policy (CSP)
    # Protege contra XSS y data injection
    # Configuración optimizada para SPA React/Vite:
    # - 'self': permite recursos del mismo origen
    # - 'unsafe-inline': necesario para estilos inline de React
    # - 'unsafe-eval': necesario para Vite/React en desarrollo (puede removerse en prod si se precompila)
    # - data: permite imágenes base64 (común en SPAs)
    # - blob: permite Web Workers y algunas APIs de archivos
    # - ws:// y wss://: permite WebSocket para Socket.io
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # 3. X-Frame-Options
    # Previene clickjacking - solo permite iframes del mismo origen
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 4. X-Content-Type-Options
    # Previene MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # 5. X-XSS-Protection
    # Protección adicional contra XSS (legacy, CSP es más importante)
    add_header X-XSS-Protection "1; mode=block" always;

    # 6. Referrer-Policy
    # Controla qué información de referencia se envía
    # strict-origin-when-cross-origin: envía origen completo a mismo origen, solo origen a externos
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 7. Permissions-Policy (antes Feature-Policy)
    # Controla qué APIs del navegador pueden usarse
    # Configuración restrictiva pero funcional para SPA:
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

    # 8. Cross-Origin-Embedder-Policy (COEP)
    # Previene carga de recursos cross-origin no explícitos
    # require-corp: requiere Cross-Origin-Resource-Policy header en recursos externos
    # Comentado por defecto - puede romper integraciones de terceros
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # 9. Cross-Origin-Opener-Policy (COOP)
    # Aísla la ventana de ventanas de otros orígenes
    # same-origin: previene ataques de cross-origin window manipulation
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # 10. Cross-Origin-Resource-Policy (CORP)
    # Controla quién puede cargar recursos de este servidor
    # cross-origin: permite cargar desde cualquier origen (necesario para APIs públicas)
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ============================================
    # RATE LIMITING STATUS
    # ============================================

    # Status code para rate limit excedido (default es 503)
    limit_req_status 429;

    # ============================================
    # AUTH ENDPOINTS CON RATE LIMITING
    # ============================================
    # NOTA: Las locations con = (exact match) tienen prioridad máxima

    # Login endpoint - Rate limiting: 5 req/min, burst de 3
    location = /api/auth/login {
        limit_req zone=auth burst=3 nodelay;

        # Proxy al backend
        proxy_pass http://backend/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Manejar errores de rate limit con respuesta JSON
        error_page 429 @rate_limit_json;
    }

    # Register endpoint - Rate limiting: 5 req/min, burst de 3
    location = /api/auth/register {
        limit_req zone=auth burst=3 nodelay;

        # Proxy al backend
        proxy_pass http://backend/api/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Manejar errores de rate limit con respuesta JSON
        error_page 429 @rate_limit_json;
    }

    # ============================================
    # RESPUESTA JSON PARA RATE LIMIT
    # ============================================

    location @rate_limit_json {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error": "Demasiados intentos. Por favor espera 1 minuto.", "code": "RATE_LIMIT_EXCEEDED", "retry_after": 60}';
    }

    # ============================================
    # API GENERAL (sin rate limiting específico)
    # ============================================
    # NOTA: Esta location tiene menor prioridad que las exactas arriba

    # Los headers CORS son manejados 100% por el backend Express
    # Nginx pasa todos los headers del backend por defecto
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # WEBSOCKET (Socket.io)
    # ============================================

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # STATIC FILES & SPA
    # ============================================

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
